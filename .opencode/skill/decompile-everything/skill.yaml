name: decompile-everything
version: "1.0.0"
description: |
  Comprehensive Ghidra-powered decompilation and symbol recovery skill.
  Uses REA's Ghidra provider to extract everything from EXE files, rename symbols,
  track progress, and export readable code for reimplementation in other languages.
  
  Modes:
  - analyze: Full binary analysis with auto-discovery
  - decompile: Bulk decompilation of all functions
  - rename: AI-assisted symbol renaming (functions, variables, types)
  - export: Export decompiled code in multiple formats
  - track: Progress tracking and parity verification
  - reconstruct: Reconstruct readable source from decompilation
  - compare: Compare versions or binaries
  - api: Native API boundary analysis
  - types: Data type recovery and reconstruction
  - full: Complete pipeline (analyze + decompile + rename + export + track)

author: OpenCode Agent
license: MIT

# This skill can be invoked as a command or used in code mode
# In code mode, it receives the tools namespace and uses actual REA tools

commands:
  - name: decompile-everything
    description: Main entry point for the decompilation pipeline
    usage: decompile-everything <mode> [options]
    examples:
      - decompile-everything full --binary ./target.exe --output ./out
      - decompile-everything analyze --binary ./target.exe
      - decompile-everything decompile --project ./ghidra_proj
      - decompile-everything rename --project ./ghidra_proj --mode ai
      - decompile-everything export --project ./ghidra_proj --format c
      - decompile-everything track --project ./ghidra_proj

tools:
  - analyze_function
  - annotate_native_function
  - batch_decompile
  - binary_overview
  - binary_session
  - build_call_path
  - close_binary
  - comment
  - compare_functions
  - decompile_all
  - find_xrefs_to_name
  - get_call_graph
  - get_evidence_bundle
  - inspect_analysis_settings
  - inspect_analysis_view
  - inspect_address_context
  - inspect_binary_layout
  - inspect_native_api
  - inspect_native_data_type
  - inspect_native_dispatch_metadata
  - inspect_native_exports
  - inspect_native_instruction
  - inspect_native_load_image
  - list_names
  - list_procedures
  - list_segments
  - list_strings
  - open_binary
  - procedure_address
  - procedure_assembly
  - procedure_callees
  - procedure_callers
  - procedure_info
  - procedure_pseudo_code
  - procedure_references
  - project_android_application_graph
  - project_apple_application_graph
  - project_managed_application_graph
  - read_bytes
  - read_function_instructions
  - resolve_containing_procedure
  - resolve_native_call_targets
  - search_procedures
  - search_strings
  - set_address_name
  - set_addresses_names
  - set_bookmark
  - set_comment
  - set_inline_comment
  - trace_call_path
  - trace_feature
  - trace_native_values
  - update_analysis_settings
  - xrefs

configuration:
  ghidra_provider: "ghidra"
  max_parallel_functions: 8
  decompilation_timeout_ms: 300000
  rename_batch_size: 50
  export_formats:
    - c
    - rust
    - go
    - python
    - json
    - markdown
    - assembly
  track_unknown_prefixes:
    - "FUN_"
    - "VAR_"
    - "DAT_"
    - "LAB_"
    - "UNK_"
    - "sub_"
    - "loc_"
    - "off_"
    - "ptr_"
    - "stru_"
    - "enum_"
    - "type_"

# This skill can be used in two ways:
# 1. As a CLI tool: `decompile-everything full --binary target.exe --output ./out`
# 2. In OpenCode code mode: the skill receives `tools` namespace and uses actual REA
code_mode_entry: "decompile_everything.pipeline:run_pipeline_with_tools"