[package]
name = "primordia"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4"
png = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The profile the profiler uses: the speed of release, but with the
# symbols a flame graph needs to name the functions it finds. Build it
# with `cargo flamegraph --profile profiling`. See docs/PROFILING.md.
[profile.profiling]
inherits = "release"
debug = 2
